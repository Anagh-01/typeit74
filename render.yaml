services:
  - type: web
    name: typeit74
    runtime: node
    plan: free

    buildCommand: |
      npm install
      cd client
      npm install
      npx vite build
      cd ../server
      npm install

    startCommand: cd server && node index.js

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: JWT_SECRET
        generateValue: true

      - key: MONGO_URI
        sync: false
